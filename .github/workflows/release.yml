name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag
        env:
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: >-
          node --eval
          "const version = require('./package.json').version;
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Release tag ${process.env.GITHUB_REF_NAME} does not match v${version}.`);
          }
          if (version.includes('-') !== (process.env.RELEASE_IS_PRERELEASE === 'true')) {
            throw new Error(`Release prerelease setting does not match package version ${version}.`);
          }"

      - name: Run release gate
        run: bun run check

      - name: Pack release artifact
        run: |
          mkdir -p /tmp/kinship-release-package
          npm pack --pack-destination /tmp/kinship-release-package

      - name: Install release artifact
        run: npm install --ignore-scripts --prefix /tmp/kinship-release-consumer /tmp/kinship-release-package/*.tgz

      - name: Copy TypeScript consumer
        run: cp .github/package-smoke/consumer.mts /tmp/kinship-release-consumer/consumer.mts

      - name: Typecheck release artifact with NodeNext resolution
        run: >-
          ./node_modules/.bin/tsc
          --noEmit
          --strict
          --target ES2023
          --module NodeNext
          --moduleResolution NodeNext
          /tmp/kinship-release-consumer/consumer.mts

      - name: Typecheck release artifact with bundler resolution
        run: >-
          ./node_modules/.bin/tsc
          --noEmit
          --strict
          --target ES2023
          --module Preserve
          --moduleResolution Bundler
          /tmp/kinship-release-consumer/consumer.mts

      - name: Consume release artifact
        working-directory: /tmp/kinship-release-consumer
        run: >-
          node --input-type=module --eval
          "import { Kinship } from '@naviary-sanctuary/kinship';
          const result = new Kinship([{ id: 'bird' }]).build();
          if (!result.ok || result.graph.nodes.length !== 1) process.exit(1);"

      - name: Publish stable release with trusted provenance
        if: ${{ !github.event.release.prerelease }}
        run: npm publish

      - name: Publish prerelease with trusted provenance
        if: ${{ github.event.release.prerelease }}
        run: npm publish --tag next
