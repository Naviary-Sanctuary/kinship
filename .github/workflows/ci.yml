name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow:
    name: GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12

  bun:
    name: Bun ${{ matrix.bun-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version:
          - 1.2.0
          - 1.3.14
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Check format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  node:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
          - 24
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run Node.js package smoke test
        run: bun run test:node

  package:
    name: Packed artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Pack clean source
        run: |
          mkdir -p /tmp/kinship-package-smoke
          npm pack --pack-destination /tmp/kinship-package-smoke

      - name: Install packed artifact
        run: npm install --ignore-scripts --prefix /tmp/kinship-package-consumer /tmp/kinship-package-smoke/*.tgz

      - name: Copy TypeScript consumer
        run: cp .github/package-smoke/consumer.mts /tmp/kinship-package-consumer/consumer.mts

      - name: Typecheck packed artifact with NodeNext resolution
        run: >-
          ./node_modules/.bin/tsc
          --noEmit
          --strict
          --target ES2023
          --module NodeNext
          --moduleResolution NodeNext
          /tmp/kinship-package-consumer/consumer.mts

      - name: Typecheck packed artifact with bundler resolution
        run: >-
          ./node_modules/.bin/tsc
          --noEmit
          --strict
          --target ES2023
          --module Preserve
          --moduleResolution Bundler
          /tmp/kinship-package-consumer/consumer.mts

      - name: Consume packed artifact
        working-directory: /tmp/kinship-package-consumer
        run: >-
          node --input-type=module --eval
          "import { Kinship } from '@naviary-sanctuary/kinship';
          const result = new Kinship([{ id: 'bird' }]).build();
          if (!result.ok || result.graph.nodes.length !== 1) process.exit(1);"
