name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow:
    name: GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2
        with:
          version-semver: 1.7.12

  bun:
    name: Bun ${{ matrix.bun-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version:
          - 1.2.0
          - 1.3.14
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Check format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  node:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
          - 24
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run Node.js package smoke test
        run: bun run test:node

  package:
    name: Packed artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Pack clean source
        run: |
          mkdir -p /tmp/kinship-package-smoke
          npm pack --pack-destination /tmp/kinship-package-smoke

      - name: Install packed artifact
        run: npm install --ignore-scripts --prefix /tmp/kinship-package-consumer /tmp/kinship-package-smoke/*.tgz

      - name: Copy TypeScript consumer
        run: cp .github/package-smoke/consumer.mts /tmp/kinship-package-consumer/consumer.mts

      - name: Typecheck packed artifact with NodeNext resolution
        run: >-
          ./node_modules/.bin/tsc
          --noEmit
          --strict
          --target ES2023
          --module NodeNext
          --moduleResolution NodeNext
          /tmp/kinship-package-consumer/consumer.mts

      - name: Typecheck packed artifact with bundler resolution
        run: >-
          ./node_modules/.bin/tsc
          --noEmit
          --strict
          --target ES2023
          --module Preserve
          --moduleResolution Bundler
          /tmp/kinship-package-consumer/consumer.mts

      - name: Consume packed artifact
        working-directory: /tmp/kinship-package-consumer
        run: >-
          node --input-type=module --eval
          "import { Kinship } from '@naviary-sanctuary/kinship';
          const result = new Kinship([{ id: 'bird' }]).build();
          if (!result.ok || result.graph.nodes.length !== 1) process.exit(1);"
